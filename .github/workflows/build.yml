name: build
on:
  push:
    branches: [work]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: java --version
      - run: ./gradlew clean build --stacktrace
      - run: bash scripts/test-domain.sh
      - name: Verify plugin JAR contents
        run: |
          mapfile -t plugin_jars < <(find build/libs -maxdepth 1 -type f -name '*.jar')
          test "${#plugin_jars[@]}" -eq 1
          jar tf "${plugin_jars[0]}" > "$RUNNER_TEMP/augmentwild-jar-entries"
          grep -Fx 'plugin.yml' "$RUNNER_TEMP/augmentwild-jar-entries"
          grep -Fx 'io/github/augmentwild/AugmentWildPlugin.class' "$RUNNER_TEMP/augmentwild-jar-entries"
          unzip -p "${plugin_jars[0]}" plugin.yml | grep -Fx 'main: io.github.augmentwild.AugmentWildPlugin'
      - uses: actions/upload-artifact@v4
        with:
          name: augmentwild-jar
          path: build/libs/*.jar
          if-no-files-found: error
  paper-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: augmentwild-jar
          path: build/libs
      - name: Boot Paper 26.3 and check AugmentWild
        run: bash scripts/test-paper-smoke.sh
      - name: Upload Paper smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-smoke-log
          path: ${{ runner.temp }}/augmentwild-paper-smoke/server.log
          if-no-files-found: ignore
  paper-arena-benchmark:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: augmentwild-jar
          path: build/libs
      - name: Measure a full 1000x1000 arena scan
        env:
          AW_ARENA_BENCHMARK: '1'
        run: bash scripts/test-paper-smoke.sh
      - name: Upload arena benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-arena-benchmark-log
          path: ${{ runner.temp }}/augmentwild-paper-smoke/server.log
          if-no-files-found: ignore
