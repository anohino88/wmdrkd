name: build
on:
  push:
    branches: [work]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: java --version
      - name: Gradle build and JUnit
        shell: bash
        run: ./gradlew clean build paperProbeJar --stacktrace 2>&1 | tee "$RUNNER_TEMP/augmentwild-build.log"
      - name: Summarize build diagnostics
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/augmentwild-build.log"; then
            {
              printf '### Gradle diagnostics\n\n```text\n'
              sed -n '1,65p' "$RUNNER_TEMP/augmentwild-build.log"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(sed -n '1,45p' "$RUNNER_TEMP/augmentwild-build.log")
            diagnostic=${diagnostic//%/%25}
            diagnostic=${diagnostic//$'\n'/%0A}
            printf '::error title=Gradle failure::%s\n' "$diagnostic"
          fi
      - name: Standalone regression and seeded draft comparison
        shell: bash
        run: |
          bash scripts/test-domain.sh | tee "$RUNNER_TEMP/augmentwild-domain.log"
          grep -E '^PHASE67_(DRAFT|AUGMENT) ' "$RUNNER_TEMP/augmentwild-domain.log" > "$RUNNER_TEMP/phase67-draft.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: phase67-draft-study
          path: ${{ runner.temp }}/phase67-draft.txt
          if-no-files-found: error
      - name: Verify plugin JAR contents
        run: |
          mapfile -t plugin_jars < <(find build/libs -maxdepth 1 -type f -name '*.jar')
          test "${#plugin_jars[@]}" -eq 1
          jar tf "${plugin_jars[0]}" > "$RUNNER_TEMP/augmentwild-jar-entries"
          grep -Fx 'plugin.yml' "$RUNNER_TEMP/augmentwild-jar-entries"
          grep -Fx 'io/github/augmentwild/AugmentWildPlugin.class' "$RUNNER_TEMP/augmentwild-jar-entries"
          unzip -p "${plugin_jars[0]}" plugin.yml | grep -Fx 'main: io.github.augmentwild.AugmentWildPlugin'
      - uses: actions/upload-artifact@v4
        with:
          name: augmentwild-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: paper-probe-jar
          path: build/paper-probe/*.jar
          if-no-files-found: error
  paper-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: augmentwild-jar
          path: build/libs
      - uses: actions/download-artifact@v4
        with:
          name: paper-probe-jar
          path: build/paper-probe
      - name: Boot Paper 26.3 and check AugmentWild
        env:
          AW_BORDER_PROBE: '1'
        run: bash scripts/test-paper-smoke.sh
      - name: Kill and restart disposable Paper supply world
        run: python3 scripts/test-supply-crash.py "$RUNNER_TEMP/augmentwild-paper-smoke"
      - name: Upload supply recovery logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-supply-crash-logs
          path: ${{ runner.temp }}/augmentwild-supply-crash-*/*.log
          if-no-files-found: ignore
      - name: Summarize synthetic combat measurements
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/augmentwild-paper-smoke/server.log"
          if test -f "$log"; then
            while IFS= read -r line; do
              printf '::notice title=Synthetic combat measurement::%s\n' "$line"
            done < <(grep -F 'SYNTHETIC_LOAD_TEST' "$log")
            if ! grep -Fq 'AW_COMBAT_LOAD_PASS' "$log"; then
              diagnostic=$(grep -E 'ERROR|Exception|AssertionError|Caused by' -A 4 "$log" | tail -20)
              diagnostic=${diagnostic//%/%25}
              diagnostic=${diagnostic//$'\n'/%0A}
              if test -n "$diagnostic"; then printf '::error title=Paper probe diagnostics::%s\n' "$diagnostic"; fi
            fi
          fi
      - name: Upload Paper smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-smoke-log
          path: ${{ runner.temp }}/augmentwild-paper-smoke/server.log
          if-no-files-found: ignore
  paper-arena-benchmark:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: augmentwild-jar
          path: build/libs
      - name: Measure a full 1000x1000 arena scan
        env:
          AW_ARENA_BENCHMARK: '1'
        run: bash scripts/test-paper-smoke.sh
      - name: Upload arena benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-arena-benchmark-log
          path: ${{ runner.temp }}/augmentwild-paper-smoke/server.log
          if-no-files-found: ignore
  paper-combat-load:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: augmentwild-jar
          path: build/libs
      - uses: actions/download-artifact@v4
        with:
          name: paper-probe-jar
          path: build/paper-probe
      - name: Repeat warmed 300-tick synthetic Paper combat
        env:
          AW_BORDER_PROBE: '1'
          AW_EXTENDED_LOAD: '1'
        run: bash scripts/test-paper-smoke.sh
      - name: Publish synthetic performance measurements
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/augmentwild-paper-smoke/server.log"
          if test -f "$log"; then
            while IFS= read -r line; do printf '::notice title=Synthetic combat measurement::%s\n' "$line"; done < <(grep -F 'SYNTHETIC_LOAD_TEST' "$log")
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-combat-load-log
          path: ${{ runner.temp }}/augmentwild-paper-smoke/server.log
          if-no-files-found: ignore
