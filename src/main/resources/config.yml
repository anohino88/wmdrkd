schema-version: 1
game:
  min-players: 2
  max-players: 16
  auto-join-online-players: true
  # Requires an enabled, isolated combat-lab world.
  allow-solo-practice: true
  gathering-seconds: 1800
  selection-interval-seconds: 300
  selection-duration-seconds: 15
  pause-match-clock-during-selection: true
  pvp-grace-seconds: 20
gathering:
  pvp-enabled: true
arena:
  mode: DEDICATED_WORLD
  world: augment_world
  width: 1000
  height: 1000
  maximum-size: 5000
  spawn:
    min-player-distance: 40
    border-margin: 24
    placement-timeout-seconds: 30
  biome:
    ocean-policy: MAX_RATIO
    maximum-ocean-ratio: 0.05
    ratio-sample-step: 32
    ratio-refine-step: 8
    ratio-refine-band: 0.02
  search:
    radius: 8192
    expand-within-world-border: true
    world-border-margin: 0
    surface-sample-step: 4
    commit-surface-step: 1
    generate-missing-chunks: false
    progress-ticks: 100
    spawn-probes-per-chunk: 8
    spawn-pool-size: 512
    chunks-per-tick: 8
    inspection-budget-micros: 1500
    used-region-buffer-blocks: 100
    max-candidate-attempts: 120
    max-search-seconds: 120
respawn:
  delay-seconds: 20
  protection-seconds: 3
  preferred-separation: 20
  retry-ticks: 20
  attempts-per-cycle: 12
  border-margin: 3
combat:
  lives: 2
border:
  start-size: 1000
  final-size: 60
  shrink-duration-seconds: 600
  damage-interval-seconds: 1
  damage-hearts: 1.0
tracker:
  amount: 1
  maximum-distance: -1
  duration-seconds: 10
  cooldown-seconds: 60
  update-seconds: 1
  reveal-name: false
scouting:
  maximum-distance: 48
  aim-seconds: 2
  cooldown-seconds: 60
  result-seconds: 15
  engagement-seconds: 30
death-review:
  window-seconds: 10
  max-records: 128
  delivery-seconds: 60
augments:
  choices-per-round: 3
  draft:
    earlier-diversity: false
    final-diversity: true
    exclude-final-xp: true
  rarity:
    silver-weight: 80
    gold-weight: 18
    prismatic-weight: 2
  proc:
    max-depth: 2
  conditions:
    low-health-fraction: 0.35
    strong-hit-points: 6.0
    rear-facing-dot: -0.5
  effects:
    xp_silver: {enabled: true, amount: 0.5, duration: 0, cooldown: 0}
    miner: {enabled: true, amount: 0.35, duration: 6, cooldown: 12}
    speed: {enabled: true, amount: 0.08, duration: 0, cooldown: 0}
    heal: {enabled: true, amount: 1.0, duration: 4, cooldown: 30}
    xp_gold: {enabled: true, amount: 1.0, duration: 0, cooldown: 0}
    rear: {enabled: true, amount: 0.2, duration: 0, cooldown: 0}
    fall: {enabled: true, amount: 0.25, duration: 0, cooldown: 0}
    armor: {enabled: true, amount: 3.0, duration: 5, cooldown: 12}
    xp_prism: {enabled: true, amount: 2.0, duration: 0, cooldown: 0}
    berserk: {enabled: true, amount: 0.25, duration: 5, cooldown: 20}
    defense: {enabled: true, amount: 0.35, duration: 0, cooldown: 25}
    pursuit: {enabled: true, amount: 0.2, duration: 4, cooldown: 12}
supply:
  windows:
    first-normal: {min-seconds: 360, max-seconds: 600}
    second-normal: {min-seconds: 840, max-seconds: 1200}
    premium: {min-seconds: 1380, max-seconds: 1680}
  announce-seconds: 120
  coordinates-seconds: 60
  opening-seconds: 3
  interaction-distance: 5.0
  movement-tolerance: 0.05
  minimum-separation: 24
  pvp-count-radius: 12
  min-height: -16
  max-height: 180
  rewards:
    normal:
      - [IRON_SWORD, ARROW*16, GOLDEN_APPLE, POTION:STRENGTH, EXPERIENCE_BOTTLE*8]
      - [IRON_CHESTPLATE, ARROW*24, GOLDEN_APPLE, POTION:SWIFTNESS, EXPERIENCE_BOTTLE*12]
      - [BOW, ARROW*32, GOLDEN_APPLE*2, POTION:REGENERATION, EXPERIENCE_BOTTLE*6]
    premium:
      - [DIAMOND_SWORD:SHARPNESS:2, BOOK:PROTECTION:3, GOLDEN_APPLE*2, POTION:STRONG_STRENGTH]
      - [DIAMOND_CHESTPLATE:PROTECTION:2, BOOK:SHARPNESS:3, GOLDEN_APPLE*3, POTION:STRONG_REGENERATION]
      - [CROSSBOW:QUICK_CHARGE:2, BOOK:POWER:3, ARROW*32, DIAMOND*2, POTION:STRONG_SWIFTNESS]
dev:
  combat-lab:
    enabled: false
    world: ""
    allow-solo: true
    # Only this isolated world uses these values. 0 inherits the production arena size.
    arena-size: 128
    search-radius: 128
    spawn-margin: 8
    min-player-distance: 40
    expand-within-world-border: false
    max-candidate-attempts: 120
    generate-missing-chunks: false
  combat-audit:
    enabled: false
    max-events: 1000

hud:
  floating-damage: false
  max-floating-numbers: 16

# Optional visual pack. Serve the raw ZIP over HTTPS and copy its SHA-1 from scripts/resource-pack.py.
art:
  url: ""
  sha1: ""
