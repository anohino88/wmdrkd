schema-version: 1
game:
  min-players: 2
  max-players: 16
  gathering-seconds: 1800
  selection-interval-seconds: 300
  selection-duration-seconds: 15
  pause-match-clock-during-selection: true
  pvp-grace-seconds: 20
gathering:
  pvp-enabled: true
arena:
  mode: DEDICATED_WORLD
  world: augment_world
  width: 1000
  height: 1000
  maximum-size: 5000
  spawn:
    min-player-distance: 80
    border-margin: 50
    placement-timeout-seconds: 30
  biome:
    ocean-policy: ZERO
  search:
    radius: 8192
    surface-sample-step: 4
    commit-surface-step: 1
    generate-missing-chunks: false
    progress-ticks: 100
    spawn-probes-per-chunk: 8
    spawn-pool-size: 512
    chunks-per-tick: 8
    used-region-buffer-blocks: 100
    max-candidate-attempts: 80
    max-search-seconds: 120
respawn:
  delay-seconds: 20
  protection-seconds: 3
  preferred-separation: 20
  retry-ticks: 20
  attempts-per-cycle: 12
  border-margin: 3
combat:
  lives: 2
border:
  start-size: 1000
  final-size: 60
  shrink-duration-seconds: 600
  damage-interval-seconds: 1
  damage-hearts: 1.0
tracker:
  amount: 1
  maximum-distance: -1
augments:
  choices-per-round: 3
  rarity:
    silver-weight: 80
    gold-weight: 18
    prismatic-weight: 2
  proc:
    max-depth: 2
  effects:
    xp_silver: {enabled: true, amount: 0.5, duration: 0, cooldown: 0}
    miner: {enabled: true, amount: 0.35, duration: 6, cooldown: 12}
    speed: {enabled: true, amount: 0.08, duration: 0, cooldown: 0}
    heal: {enabled: true, amount: 1.0, duration: 4, cooldown: 30}
    xp_gold: {enabled: true, amount: 1.0, duration: 0, cooldown: 0}
    rear: {enabled: true, amount: 0.2, duration: 0, cooldown: 0}
    fall: {enabled: true, amount: 0.25, duration: 0, cooldown: 0}
    armor: {enabled: true, amount: 3.0, duration: 5, cooldown: 12}
    xp_prism: {enabled: true, amount: 2.0, duration: 0, cooldown: 0}
    berserk: {enabled: true, amount: 0.25, duration: 5, cooldown: 20}
    defense: {enabled: true, amount: 0.35, duration: 0, cooldown: 25}
    pursuit: {enabled: true, amount: 0.2, duration: 4, cooldown: 12}
supply:
  normal:
    time-seconds: 900
  premium:
    time-seconds: 1500
