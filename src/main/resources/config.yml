schema-version: 1
game:
  min-players: 2
  max-players: 16
  gathering-seconds: 1800
  selection-interval-seconds: 300
  selection-duration-seconds: 15
  pause-match-clock-during-selection: true
  pvp-grace-seconds: 20
arena:
  mode: DEDICATED_WORLD
  world: augment_world
  width: 1000
  height: 1000
  maximum-size: 5000
  spawn:
    min-player-distance: 80
  biome:
    ocean-policy: ZERO
  search:
    max-candidate-attempts: 80
    max-search-seconds: 120
respawn:
  delay-seconds: 20
  test-return:
    enabled: false
    world: world
    x: 0
    y: 64
    z: 0
combat:
  lives: 2
border:
  start-size: 1000
  final-size: 60
  shrink-duration-seconds: 600
tracker:
  amount: 1
  maximum-distance: -1
augments:
  choices-per-round: 3
  rarity:
    silver-weight: 80
    gold-weight: 18
    prismatic-weight: 2
  proc:
    max-depth: 2
supply:
  normal:
    time-seconds: 900
  premium:
    time-seconds: 1500
