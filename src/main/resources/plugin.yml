name: AugmentWild
version: '0.1.0-SNAPSHOT'
main: io.github.augmentwild.AugmentWildPlugin
api-version: '26.3'
commands:
  aw:
    description: 증강 야생 명령어
    usage: "/aw [menu|join|leave|status|augment|augments|ui|combatlog|supply|result|history|locate|track|scout|death|skill|cast|art|admin] (TAB 자동완성) · /aw admin test solo"
permissions:
  augmentwild.play:
    default: true
  augmentwild.track:
    default: true
  augmentwild.admin:
    default: op
  augmentwild.admin.test:
    default: op
